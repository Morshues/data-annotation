# Keep the scheme set by a reverse proxy in front (e.g. HTTPS on the host), so
# the API can tell the original request was secure. Only safe because the port
# is bound to loopback by default, see docker-compose.yml.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Slightly above the API's largest body limit (20 MB table imports) so
        # the API returns the error
        client_max_body_size 21m;
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
